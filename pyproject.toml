[project]
name = "omaker"
version = "0.2.0"
description = "OMAKER: texto biomedico para ontologia OWL (NER + LLM local + classificador de relacoes PURE)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "owlready2>=0.47",
    "torch>=2.4",
    "transformers>=4.44,<6",
    "sentence-transformers>=3",
    "scikit-learn>=1.5",
    "numpy",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pre-commit>=4",
    "pyinstaller>=6.10",
]

[tool.uv]
# Aplicacao rodada a partir da raiz (pacote omaker/), sem instalacao editavel: no Python 3.12 do
# Windows o .pth da instalacao editavel e lido em cp1252 e quebra quando o caminho tem acento.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: baixa modelos do Hugging Face",
    "ollama: precisa do Ollama real",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["omaker/ui/recursos_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "BLE"]
# E501 fora: prompts do LLM e folhas de estilo Qt (strings longas) nao podem ser quebradas sem mudar o conteudo.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["omaker"]
