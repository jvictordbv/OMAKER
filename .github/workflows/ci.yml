name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Instalar dependencias
        # dspy: extra opcional so para os testes de omaker.llm.optimize (o exe.yml continua so com --extra dev)
        run: uv sync --extra dev --extra dspy
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Testes rapidos
        run: uv run pytest -q -m "not slow and not ollama"
